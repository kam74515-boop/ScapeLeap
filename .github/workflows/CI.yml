name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3008
      BETTER_AUTH_URL: http://localhost:3008
      BETTER_AUTH_SECRET: ci-quality-only-secret-at-least-32-characters
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: ./.github/actions/setup-project
        with:
          node-version: 22.18.0
      - run: npm run lint
      - run: npm run check:types
      - run: npm run check:deps
      - run: npm run check:i18n
      - run: npm run test:unit

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: ./.github/actions/setup-project
        with:
          node-version: 22.18.0
      - run: npm run build-local
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3008
          BETTER_AUTH_URL: http://localhost:3008
          BETTER_AUTH_SECRET: ci-build-only-secret-at-least-32-characters
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: mcr.microsoft.com/playwright:v1.62.0-noble
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: ./.github/actions/setup-project
        with:
          node-version: 22.18.0
      - run: npm run build-local
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3008
          BETTER_AUTH_URL: http://localhost:3008
          BETTER_AUTH_SECRET: ci-e2e-only-secret-at-least-32-characters
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      - run: npm test
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3008
          BETTER_AUTH_URL: http://localhost:3008
          BETTER_AUTH_SECRET: ci-ui-only-secret-at-least-32-characters
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      - run: npm run test:e2e
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
